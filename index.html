<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earth Eye – Image → Features → Explanation</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#14202e;--mu:#5d6b7c;--ac:#1d6fe8;--bd:#dde3ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--tx:#e8eef7;--mu:#93a1b5;--ac:#5aa2ff;--bd:#25324a}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--tx:#e8eef7;--mu:#93a1b5;--ac:#5aa2ff;--bd:#25324a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:720px;margin:auto}
h1{font-size:22px;margin:4px 0}h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 8px}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
canvas{width:100%;height:auto;border-radius:10px;display:block;background:#000}
button,label.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-block}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=file]{display:none}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
.track{flex:1;height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.fill{height:100%}
.pct{width:42px;text-align:right;color:var(--mu)}
.exp{font-size:17px}.det{color:var(--mu);font-size:14px;margin-top:8px}
</style></head><body>
<h1>🛰️ Earth Eye</h1>
<p class="sub">Image → Feature Detection → Explanation. Pick any NASA / satellite / space photo. Everything runs on your device.</p>

<div class="card"><h2>1 · Image</h2>
<div class="row" style="margin-bottom:10px">
<label class="btn">Choose image<input id="f" type="file" accept="image/*"></label>
<button class="alt" id="tog">Hide overlay</button></div>
<canvas id="c" width="640" height="400"></canvas></div>

<div class="card"><h2>2 · Feature detection</h2><div id="feat">Waiting for an image…</div></div>
<div class="card"><h2>3 · Explanation</h2><div id="exp" class="exp">—</div><div id="det" class="det"></div></div>

<script>
// ---- Classes: label, colour, plain-language phrase ----
const CL={
 cloud:{n:"Clouds / Ice",c:"#facc15",p:"bright cloud or ice cover"},
 ocean:{n:"Ocean / Water",c:"#2f7bff",p:"open water"},
 forest:{n:"Forest / Vegetation",c:"#22c55e",p:"green vegetation"},
 fire:{n:"Fire / Hot spot",c:"#ff3b1f",p:"a glowing or burning area"},
 land:{n:"Land / Desert",c:"#e0a458",p:"dry land or desert"},
 urban:{n:"Urban / Rocky surface",c:"#a78bfa",p:"rocky or built-up ground"},
 space:{n:"Space / Dark area",c:"#475569",p:"dark space or shadow"}
};
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;let h=0;
 if(d){if(M==r)h=((g-b)/d)%6;else if(M==g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
 return [h,M?d/M:0,M]}
// Rule that names a colour cluster
function classify(r,g,b){const [h,s,v]=rgb2hsv(r,g,b);
 if(v<0.22)return(s>0.4&&h>=185&&h<=265)?"ocean":"space";
 if(s>0.6&&v>0.7&&(h<40||h>340))return"fire";
 if(s<0.22)return v>0.4?"cloud":"urban";
 if(h>=185&&h<=265)return v>0.8&&s<0.3?"cloud":"ocean";
 if(h>=65&&h<=165)return"forest";
 if(h>=15&&h<=65)return"land";
 return"urban"}
// ---- k-means (unsupervised ML) on pixel colours ----
function kmeans(px,k,it=12){const n=px.length/3,cen=[];
 for(let i=0;i<k;i++){const j=Math.floor((i+.5)/k*n)*3;cen.push([px[j],px[j+1],px[j+2]])}
 const lab=new Uint8Array(n);
 for(let t=0;t<it;t++){const s=Array.from({length:k},()=>[0,0,0,0]);
  for(let i=0;i<n;i++){let b=0,bd=1e9;for(let c=0;c<k;c++){const dr=px[i*3]-cen[c][0],dg=px[i*3+1]-cen[c][1],db=px[i*3+2]-cen[c][2],d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;b=c}}
   lab[i]=b;const a=s[b];a[0]+=px[i*3];a[1]+=px[i*3+1];a[2]+=px[i*3+2];a[3]++}
  for(let c=0;c<k;c++)if(s[c][3])cen[c]=[s[c][0]/s[c][3],s[c][1]/s[c][3],s[c][2]/s[c][3]]}
 return{lab,cen}}
// largest connected region of a class on the grid -> centroid
function biggest(map,W,H,cls){const seen=new Uint8Array(W*H);let best=null;
 for(let s=0;s<W*H;s++){if(seen[s]||map[s]!==cls)continue;const q=[s];seen[s]=1;let sx=0,sy=0,cnt=0;
  while(q.length){const p=q.pop(),x=p%W,y=(p/W)|0;sx+=x;sy+=y;cnt++;
   for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const ni=ny*W+nx;if(!seen[ni]&&map[ni]===cls){seen[ni]=1;q.push(ni)}}}
  if(!best||cnt>best.cnt)best={cnt,x:sx/cnt,y:sy/cnt}}
 return best}
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let img=null,res=null,show=true;
function analyze(){
 const cw=640,ch=Math.round(640*img.height/img.width);cv.width=cw;cv.height=ch;
 const W=96,H=Math.max(8,Math.round(96*img.height/img.width));
 const t=document.createElement('canvas');t.width=W;t.height=H;const tc=t.getContext('2d');tc.drawImage(img,0,0,W,H);
 const d=tc.getImageData(0,0,W,H).data,px=new Float32Array(W*H*3);
 for(let i=0;i<W*H;i++){px[i*3]=d[i*4];px[i*3+1]=d[i*4+1];px[i*3+2]=d[i*4+2]}
 const {lab,cen}=kmeans(px,10),names=cen.map(c=>classify(...c)),map=new Array(W*H),tot={};
 for(let i=0;i<W*H;i++){map[i]=names[lab[i]];tot[map[i]]=(tot[map[i]]||0)+1}
 const feats=Object.keys(tot).map(k=>({k,pct:tot[k]/(W*H)*100,pos:biggest(map,W,H,k)})).filter(f=>f.pct>=1.5).sort((a,b)=>b.pct-a.pct);
 res={W,H,map,feats};draw();report()}
function draw(){ctx.drawImage(img,0,0,cv.width,cv.height);if(!res||!show)return;
 const {W,H,map,feats}=res,sx=cv.width/W,sy=cv.height/H,keep=new Set(feats.map(f=>f.k));
 ctx.globalAlpha=.38;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=map[y*W+x];if(!keep.has(k))continue;ctx.fillStyle=CL[k].c;ctx.fillRect(x*sx,y*sy,sx+1,sy+1)}
 ctx.globalAlpha=1;ctx.font="bold 15px system-ui";ctx.textBaseline="middle";
 feats.slice(0,6).forEach(f=>{if(!f.pos)return;const x=f.pos.x*sx,y=f.pos.y*sy,t=CL[f.k].n,w=ctx.measureText(t).width+16,
  bx=Math.min(Math.max(x-w/2,4),cv.width-w-4),by=Math.min(Math.max(y-12,4),cv.height-28);
  ctx.fillStyle="rgba(0,0,0,.75)";ctx.beginPath();ctx.roundRect(bx,by,w,24,8);ctx.fill();
  ctx.strokeStyle=CL[f.k].c;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#fff";ctx.fillText(t,bx+8,by+12)})}
function report(){const f=res.feats;
 document.getElementById('feat').innerHTML=f.map(x=>`<div class="bar"><span class="dot" style="background:${CL[x.k].c}"></span><span style="width:150px">${CL[x.k].n}</span><span class="track"><span class="fill" style="display:block;width:${x.pct}%;background:${CL[x.k].c}"></span></span><span class="pct">${x.pct.toFixed(0)}%</span></div>`).join('');
 const top=f.slice(0,4),ph=top.map(x=>CL[x.k].p);
 let list=ph.length>1?ph.slice(0,-1).join(", ")+" and "+ph.slice(-1):ph[0];
 let s=`This image mostly shows ${list}. The biggest feature is ${CL[top[0].k].p}, covering about ${top[0].pct.toFixed(0)}% of the picture.`;
 const cl=f.find(x=>x.k==="cloud");
 if(cl&&cl.pos&&cl.pos.cnt/(res.W*res.H)>0.15)s+=" The large connected cloud mass could be a storm system.";
 if(f.some(x=>x.k==="fire"))s+=" There is also a bright red-orange spot that could be a fire or hot area.";
 if(f.some(x=>x.k==="space"))s+=" Dark regions suggest space, night, or deep shadow.";
 document.getElementById('exp').textContent=s;
 document.getElementById('det').textContent="Detected: "+f.map(x=>CL[x.k].n).join(", ")+"."}
document.getElementById('f').onchange=e=>{const file=e.target.files[0];if(!file)return;const i=new Image();i.onload=()=>{img=i;analyze()};i.src=URL.createObjectURL(file)};
document.getElementById('tog').onclick=e=>{show=!show;e.target.textContent=show?"Hide overlay":"Show overlay";if(img)draw()};
ctx.fillStyle="#111";ctx.fillRect(0,0,640,400);ctx.fillStyle="#889";ctx.font="18px system-ui";ctx.textAlign="center";ctx.fillText("Choose an image to begin",320,200);ctx.textAlign="left";
</script></body></html>
